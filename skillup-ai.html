<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillUp AI | Createnex</title>

<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #030712;
    --accent-cyan: #22d3ee;
    --accent-blue: #3b82f6;
    --accent-purple: #818cf8;
    --text-dim: #9ca3af;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg-dark); color: #fff; overflow-x:hidden; }

  .bg-glow {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background:
      radial-gradient(circle at 20% 30%, rgba(59,130,246,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(34,211,238,0.1) 0%, transparent 40%);
    z-index:-1;
  }

  /* --- NAVBAR (copied from main site) --- */
  .navbar {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 8%; backdrop-filter: blur(15px);
    background: rgba(3,7,18,0.7);
    border-bottom: 1px solid var(--glass-border);
    position: fixed; width:100%; top:0; z-index:1000;
  }
  .logo img { height:80px; }
  .nav-links ul { list-style:none; display:flex; gap:30px; }
  .nav-links a {
    text-decoration:none; color: var(--text-dim); font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:1.5px; transition:0.3s;
  }
  .nav-links a:hover { color: var(--accent-cyan); }
  .nav-links a.skillup-highlight,
  .side-drawer a.skillup-highlight {
    background: linear-gradient(45deg, var(--accent-blue), var(--accent-cyan));
    color:#fff; padding:8px 18px; border-radius:20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .side-drawer a.skillup-highlight { text-align:center; border-bottom:none; }
  .nav-links a.skillup-highlight:hover,
  .side-drawer a.skillup-highlight:hover {
    color:#fff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34,211,238,0.35);
  }

  #menu-toggle { display:none; }
  .menu-btn { display:none; font-size:26px; cursor:pointer; color:#fff; line-height:1; }
  .menu-btn:hover { color: var(--accent-cyan); }

  .drawer-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter: blur(8px);
    opacity:0; visibility:hidden; transition: opacity 0.3s ease, visibility 0.3s ease; z-index:998;
  }
  .side-drawer {
    position:fixed; top:0; left:0; width:260px; height:100vh;
    background: rgba(15,23,42,0.88); backdrop-filter: blur(18px);
    border-right: 1px solid var(--glass-border);
    transform: translateX(-100%); transition: transform 0.35s ease; z-index:999;
    padding:80px 24px 24px; display:flex; flex-direction:column; gap:10px;
  }
  .side-drawer a {
    text-decoration:none; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:1.6px; font-size:13px; font-weight:600; padding:10px 0;
    border-bottom:1px solid rgba(148,163,184,0.15); transition: color 0.2s ease, transform 0.2s ease;
  }
  .side-drawer a:last-child { border-bottom:none; }
  .side-drawer a:hover { color: var(--accent-cyan); transform: translateX(4px); }
  #menu-toggle:checked ~ .drawer-overlay { opacity:1; visibility:visible; }
  #menu-toggle:checked ~ .side-drawer { transform: translateX(0); }
  .drawer-overlay-label { position:fixed; inset:0; cursor:pointer; }

  @media (max-width: 900px) {
    .nav-links { display:none; }
    .menu-btn { display:block; }
  }

  /* --- FORM SECTION --- */
  .skillup-hero {
    min-height:100vh;
    padding:140px 8% 80px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .form-wrap { max-width: 640px; width:100%; text-align:center; }

  .section-label {
    font-size:14px; font-weight:800; color: var(--accent-cyan);
    text-transform:uppercase; letter-spacing:3px; margin-bottom:15px; display:block;
  }

  .section-title {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight:800; line-height:1.1; margin-bottom:18px;
    background: linear-gradient(to right, #ffffff, var(--accent-cyan));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }

  .form-subtitle {
    color: var(--text-dim);
    font-size:15px;
    line-height:1.6;
    margin-bottom:40px;
  }

  .skillup-form-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px;
    text-align: left;
  }

  .form-group { margin-bottom:20px; }

  .form-group label {
    display:block; font-size:13px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; color: var(--text-dim); margin-bottom:8px;
  }

  .form-group input,
  .form-group select {
    width:100%;
    padding:13px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color:#fff;
    font-size:15px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .form-group select option { background: #0f172a; color:#fff; }

  .form-group input::placeholder { color: rgba(255,255,255,0.3); }

  .form-group input:focus,
  .form-group select:focus {
    outline:none;
    border-color: var(--accent-cyan);
    background: rgba(34,211,238,0.05);
  }

  #school-field { display:none; }

  .submit-btn {
    width:100%;
    padding:15px;
    background: linear-gradient(45deg, var(--accent-blue), var(--accent-cyan));
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    margin-top:10px;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(34,211,238,0.3);
  }

  .form-status {
    margin-top:16px;
    font-size:14px;
    text-align:center;
    display:none;
  }
  .form-status.success { color:#4ade80; display:block; }
  .form-status.error { color:#f87171; display:block; }

  /* --- RESPONSIVE --- */
  @media (max-width: 900px) {
    .skillup-hero { padding:120px 6% 60px; }
  }

  @media (max-width: 600px) {
    .skillup-hero { padding:110px 5% 50px; }
    .skillup-form-card { padding:26px 20px; border-radius:18px; }
    .section-title { font-size:1.9rem; }
    .logo img { height:60px; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<input type="checkbox" id="menu-toggle">

<div class="drawer-overlay">
  <label for="menu-toggle" class="drawer-overlay-label"></label>
</div>

<nav class="side-drawer">
  <a href="main1.html">Home</a>
  <a href="about.html">About</a>
  <a href="why.html">Why Us</a>
  <a href="service1.html">Services</a>
  <a href="client.html">Clients</a>
  <a href="contact1.html">Contact</a>
  <a href="skillup-ai.html" class="skillup-highlight">SkillUp AI</a>
</nav>

<header class="navbar">
  <div class="logo"><img src="logo.png" alt="CreatNex Logo"></div>
  <nav class="nav-links">
    <ul>
      <li><a href="main1.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="why.html">Why Us</a></li>
      <li><a href="service1.html">Services</a></li>
      <li><a href="client.html">Clients</a></li>
      <li><a href="contact1.html">Contact</a></li>
      <li><a href="skillup-ai.html" class="skillup-highlight">SkillUp AI</a></li>
    </ul>
  </nav>
  <label for="menu-toggle" class="menu-btn">☰</label>
</header>

<section class="skillup-hero">
  <div class="form-wrap">
    <span class="section-label">SkillUp AI</span>
    <h1 class="section-title">Register Your Interest</h1>
    <p class="form-subtitle">Tell us a bit about yourself and we'll reach out with everything you need to get started with our AI training program.</p>

    <div class="skillup-form-card">
      <!-- Replace YOUR_FORM_ID with your real Formspree endpoint -->
      <form id="skillup-form" action="https://formspree.io/f/mdarwane" method="POST">

        <div class="form-group">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="First Name" required>
        </div>

        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="Last Name" required>
        </div>

        <div class="form-group">
          <label for="contact_number">Contact Number</label>
          <input type="tel" id="contact_number" name="Contact Number" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label for="email">Email ID</label>
          <input type="email" id="email" name="Email ID" required>
        </div>

        <div class="form-group">
          <label for="source">How did you get to know about this course?</label>
          <input type="text" id="source" name="How did you get to know about this course" required>
        </div>

        <div class="form-group">
          <label for="are_you_a">Are you a</label>
          <select id="are_you_a" name="Are you a" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Student">Student</option>
            <option value="Working Professional">Working Professional</option>
          </select>
        </div>

        <div class="form-group" id="school-field">
          <label for="school_name">School / College Name</label>
          <input type="text" id="school_name" name="School Name">
        </div>

        <button type="submit" class="submit-btn">Submit</button>
        <p class="form-status" id="form-status"></p>
      </form>
    </div>
  </div>
</section>

<script>
  const roleSelect = document.getElementById('are_you_a');
  const schoolField = document.getElementById('school-field');
  const schoolInput = document.getElementById('school_name');

  roleSelect.addEventListener('change', function () {
    if (this.value === 'Student') {
      schoolField.style.display = 'block';
      schoolInput.setAttribute('required', 'required');
    } else {
      schoolField.style.display = 'none';
      schoolInput.removeAttribute('required');
      schoolInput.value = '';
    }
  });

  const form = document.getElementById('skillup-form');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const data = new FormData(form);

    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(response => {
      if (response.ok) {
        status.textContent = "Thanks! Your response has been submitted. We'll get in touch soon.";
        status.className = 'form-status success';
        form.reset();
        schoolField.style.display = 'none';
      } else {
        status.textContent = "Something went wrong. Please try again.";
        status.className = 'form-status error';
      }
    }).catch(() => {
      status.textContent = "Network error. Please check your connection and try again.";
      status.className = 'form-status error';
    });
  });
</script>

</body>
</html>
